<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Mail</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="public/rocket-c.webp" type="image/x-icon">
</head>
<body>

    <section class="game" id="game">
        <div class="bg section-blur"></div>
        
        <div class="rocket-container" id="rocket">
            <div id="rocket-img"></div>
            <div id="boom"></div>
        </div>

        <div class="planet-wrapper">
            <div class="planet planet-move"></div>
        </div>
        
        <div class="scoreboard">
            <div class="score-img"></div>
            <div>SCORE</div>
            <div id="score">0</div>
        </div>

    </section>


    <div class="preload">
        <img src="public/Planets/planet00.webp" class="pl-img">
        <img src="public/Planets/planet01.webp" class="pl-img">
        <img src="public/Planets/planet02.webp" class="pl-img">
        <img src="public/Planets/planet03.webp" class="pl-img">
        <img src="public/Planets/planet04.webp" class="pl-img">
        <img src="public/Planets/planet05.webp" class="pl-img">
        <img src="public/Planets/planet06.webp" class="pl-img">
        <img src="public/Planets/planet07.webp" class="pl-img">
        <img src="public/Planets/planet08.webp" class="pl-img">
        <img src="public/Planets/planet09.webp" class="pl-img">
        <img src="public/UFOs/u1.png" class="pl-img">
        <img src="public/UFOs/u2.png" class="pl-img">
        <img src="public/UFOs/u3.png" class="pl-img">
        <img src="public/UFOs/u4.png" class="pl-img">
        <img src="public/UFOs/u5.png" class="pl-img">
        <img src="public/UFOs/as.webp" class="pl-img">
        <img src="public/bg.webp" class="pl-img">
        <img src="public/boom.png" class="pl-img">
        <img src="public/rocket-c.webp" class="pl-img">
        <img src="public/rocket.webp" class="pl-img">
    </div>

    <script src="game.js"></script>
</body>
</html>
